<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="feltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="tileIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="brassPin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo verde casino -->
  <rect width="512" height="512" rx="110" fill="url(#feltBg)" stroke="#10b981" stroke-width="8"/>

  <!-- Ficha de dominó principal 6-6 -->
  <g filter="url(#shadow)">
    <rect x="156" y="76" width="200" height="360" rx="24" fill="url(#tileIvory)" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Línea divisoria central con perno de latón -->
    <line x1="176" y1="256" x2="336" y2="256" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="10" fill="url(#brassPin)"/>

    <!-- Puntos superiores (6) -->
    <circle cx="196" cy="120" r="14" fill="#0f172a"/>
    <circle cx="196" cy="166" r="14" fill="#0f172a"/>
    <circle cx="196" cy="212" r="14" fill="#0f172a"/>
    <circle cx="316" cy="120" r="14" fill="#0f172a"/>
    <circle cx="316" cy="166" r="14" fill="#0f172a"/>
    <circle cx="316" cy="212" r="14" fill="#0f172a"/>

    <!-- Puntos inferiores (6) -->
    <circle cx="196" cy="300" r="14" fill="#0f172a"/>
    <circle cx="196" cy="346" r="14" fill="#0f172a"/>
    <circle cx="196" cy="392" r="14" fill="#0f172a"/>
    <circle cx="316" cy="300" r="14" fill="#0f172a"/>
    <circle cx="316" cy="346" r="14" fill="#0f172a"/>
    <circle cx="316" cy="392" r="14" fill="#0f172a"/>
  </g>
</svg>
