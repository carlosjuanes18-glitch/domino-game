<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 185" width="100%" height="100%">
  <defs>
    <!-- Gradiente marfil para el cuerpo de ficha -->
    <linearGradient id="scaredBone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="scaredShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#scaredShadow)">
    <!-- Patitas corriendo desesperadamente (hacia la izquierda, huyendo) -->
    <!-- Pierna delantera extendida en carrera loca -->
    <path d="M 52 135 L 26 150 L 8 142" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 52 135 L 26 150 L 8 142" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="8" cy="142" rx="10" ry="6" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Pierna trasera pateando el aire hacia atrás -->
    <path d="M 96 135 L 126 155 L 148 148" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 96 135 L 126 155 L 148 148" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="148" cy="148" rx="10" ry="6" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Brazo delantero agitándose en pánico -->
    <path d="M 40 70 Q 15 50 20 28" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 40 70 Q 15 50 20 28" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="28" r="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <!-- Brazo trasero levantado desesperado -->
    <path d="M 110 70 Q 135 48 130 25" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 110 70 Q 135 48 130 25" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="130" cy="25" r="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <!-- CUERPO PRINCIPAL: FICHA DE DOMINÓ (inclinada hacia adelante por la velocidad) -->
    <rect x="38" y="24" width="76" height="120" rx="12" ry="12" fill="url(#scaredBone)" stroke="#0f172a" stroke-width="3.5"/>
    
    <!-- Línea divisoria central con remache -->
    <line x1="42" y1="84" x2="110" y2="84" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="76" cy="84" r="3.5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>

    <!-- Puntos de dominó (Pips) en mitad inferior (ej. doble blanco o 2 puntos temblando) -->
    <circle cx="56" cy="114" r="5" fill="#0f172a"/>
    <circle cx="96" cy="114" r="5" fill="#0f172a"/>

    <!-- CARA ATERRADA EN MITAD SUPERIOR (Mirando hacia atrás con terror) -->
    <!-- Gotas de sudor frío volando en el aire -->
    <path d="M 28 36 Q 22 42 28 46 Q 34 42 28 36 Z" fill="#38bdf8"/>
    <path d="M 36 20 Q 30 25 36 29 Q 42 25 36 20 Z" fill="#38bdf8"/>
    <path d="M 120 20 Q 115 25 120 28 Q 125 25 120 20 Z" fill="#38bdf8"/>

    <!-- Cejas temblorosas de puro pánico -->
    <path d="M 52 46 Q 60 40 68 45" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 84 45 Q 92 40 100 46" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Ojos gigantes saltones de terror mirando hacia la derecha (hacia el psicópata que lo sigue) -->
    <!-- Ojo izquierdo -->
    <ellipse cx="60" cy="56" rx="11" ry="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <ellipse cx="66" cy="56" rx="5.5" ry="6.5" fill="#0284c7"/>
    <circle cx="67" cy="56" r="3" fill="#000000"/>
    <circle cx="64" cy="53" r="2" fill="#ffffff"/>

    <!-- Ojo derecho -->
    <ellipse cx="92" cy="56" rx="11" ry="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <ellipse cx="98" cy="56" rx="5.5" ry="6.5" fill="#0284c7"/>
    <circle cx="99" cy="56" r="3" fill="#000000"/>
    <circle cx="96" cy="53" r="2" fill="#ffffff"/>

    <!-- Boca abierta gritando en pánico (forma de óvalo tembloroso) -->
    <ellipse cx="76" cy="74" rx="10" ry="7.5" fill="#450a0a" stroke="#0f172a" stroke-width="2"/>
    <path d="M 70 76 Q 76 72 82 76" fill="#f87171"/>
    <!-- Dientes superiores temblando -->
    <rect x="71" y="67" width="10" height="3" rx="1" fill="#ffffff"/>
  </g>
</svg>
